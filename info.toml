[[exercises]]
name = "variables1"
path = "exercises/variables/variables1/main.go"
mode = "compile"
hint = """
Variables must have names."""
nudge = '''
`unexpected =, expected name`: the parser read `var` and wanted the variable's name next, but found `=` straight away.'''
stronger = '''
The `var` line is missing one word between `var` and `=`. Look at the `Printf` below it to see which name the rest of `main` already uses.'''

[[exercises]]
name = "variables2"
path = "exercises/variables/variables2/main.go"
mode = "compile"
hint = """
It is missing a symbol used to declare and initialize variables."""
nudge = '''
`undefined: x`: `x = 5` is a plain assignment, and you can only assign to a variable that already exists. Nothing has declared `x` yet.'''
stronger = '''
Go has a short form that declares a variable and gives it a value in one step. Change the assignment on the `x = 5` line to that form; one extra character is enough.'''

[[exercises]]
name = "variables3"
path = "exercises/variables/variables3/main.go"
mode = "compile"
hint = """
Could it be missing the variable type?"""
nudge = '''
`unexpected newline, expected type`: `var x` on its own gives Go nothing to infer a type from, so the line has to name one.'''
stronger = '''
Either add a type after `x`, or give `x` an initial value so Go infers the type. The `%d` verb in the `Printf` tells you which kind of value it should hold.'''

[[exercises]]
name = "variables4"
path = "exercises/variables/variables4/main.go"
mode = "compile"
hint = """
Variables can be redeclared in new blocks, but it is missing something. What is it?"""
nudge = '''
`cannot use 1 ... as string value`: inside the `if` block, `x = 1` assigns to the outer `x`, which is a `string`. Plain `=` never creates a new variable.'''
stronger = '''
Leave the outer `x` alone (its line says not to change it). Inside the block, declare a new `x` that shadows the outer one, using the operator that both declares and assigns.'''

[[exercises]]
name = "variables5"
path = "exercises/variables/variables5/main.go"
mode = "compile"
hint = """
Constants need initialization."""
nudge = '''
`missing init expr for Pi`: a constant is fixed when the program compiles, so it has to be given its value where it is declared.'''
stronger = '''
Finish the `const Pi` line with `=` and a value. Constants cannot be set later, so the value must go on that line.'''

[[exercises]]
name = "variables6"
path = "exercises/variables/variables6/main.go"
mode = "compile"
hint = """
Constants can't be changed."""
nudge = '''
`cannot assign to x`: `x` is a constant, and a constant can never be the target of an assignment.'''
stronger = '''
If `x` needs to change, it has to be a variable rather than a constant. Change how `x` is declared, not the line that adds 1.'''

