then keeps it from returning while a handler is still writing. Counter.Next is
already locked — leave it that way, the race detector is watching."""
nudge = '''
Six slow clients at 300ms each took 1.8s in total, so they were served one after another. The handler runs inline in the accept loop, which means each client waits for every client ahead of it.'''
stronger = '''
Each connection should get its own goroutine, so the accept loop never waits on a handler. The `WaitGroup` already has a `Wait`; it only means something if every goroutine is counted before it starts and marks itself finished on every exit path. This exercise is race-checked: a plain run can pass by luck, and `go test -race` is the real judge.'''

[[exercises]]
name = "binary1"
path = "exercises/binary_encoding/binary1/main_test.go"
mode = "test"
hint = """
io.ReadFull(r, buf[:]) fills the whole header or fails — that is what turns a
truncated stream into io.ErrUnexpectedEOF. Then each field is two bytes:

	ID:        binary.BigEndian.Uint16(buf[0:2]),
	Flags:     binary.BigEndian.Uint16(buf[2:4]),
	Questions: binary.BigEndian.Uint16(buf[4:6]),
	...

Encoding is the mirror image with PutUint16 at the same offsets."""
nudge = '''
Every field decodes as zero because nothing is ever read from `r` into `buf`, so it is decoded while still empty. A truncated input also returns no error. `EncodeHeader` writes only the ID, so the round trip loses the other fields too.'''
stronger = '''
In `DecodeHeader`, fill `buf` with `io.ReadFull` and return its error, which is what produces `io.ErrUnexpectedEOF` on short input. Then decode all six fields with `binary.BigEndian.Uint16`, two bytes each at consecutive offsets. In `EncodeHeader`, mirror that with `PutUint16` for the remaining five fields.'''

[[exercises]]
name = "binary2"
path = "exercises/binary_encoding/binary2/main_test.go"
mode = "test"
hint = """
Every field is a shift and a width. Reading: shift down to bit 0, then mask.

	Opcode:      uint8(w >> 11 & 0xf),   // 4 bits starting at bit 11
	Authorative: w>>10&1 == 1,

Writing is the reverse, and the mask goes on before the shift:

	w |= uint16(f.Opcode&0xf) << 11

Skipping that mask is what lets an over-wide Opcode corrupt QR."""
nudge = '''
Only the QR bit is handled. Every other field parses as zero and is never packed, so the round trip keeps nothing but bit 15.'''
stronger = '''
Copy the `Response` pattern for each field, using the bit diagram above the `Flags` struct: in `ParseFlags`, shift right by the field's position and AND with a mask of its width (`1` for single bits, `0xf` for 4-bit fields). In `PackFlags`, mask the 4-bit values first, then shift left and OR them in, so a value that is too wide cannot spill into the neighbouring field.'''

[[exercises]]
name = "binary3"
path = "exercises/binary_encoding/binary3/main_test.go"
mode = "test"
hint = """
Read the prefix, check it, then read exactly that much:

	var lenBuf [4]byte
	if _, err := io.ReadFull(r, lenBuf[:]); err != nil {
		return nil, err
	}
	n := binary.BigEndian.Uint32(lenBuf[:])
	if n > MaxFrame {
		return nil, fmt.Errorf("%w: %d bytes", ErrFrameTooLarge, n)
	}
	payload := make([]byte, n)
	_, err := io.ReadFull(r, payload)

The order matters: allocating before the check is the denial of service."""
nudge = '''
`ReadFrame` is still a stub that always returns an error. The tests also expect two specific failures: `io.ErrUnexpectedEOF` for a cut-off payload, and `ErrFrameTooLarge` for a length prefix that is too big to trust.'''
stronger = '''
In `ReadFrame`, use `io.ReadFull` to read 4 bytes into a length buffer and decode them with `binary.BigEndian.Uint32`. Compare that length against `MaxFrame` before you `make` the payload slice, wrapping `ErrFrameTooLarge` with `%w`. Then `io.ReadFull` the payload. Return the header read's error unchanged, so an empty stream gives a clean `io.EOF`.'''

[[exercises]]
name = "binary4"
path = "exercises/binary_encoding/binary4/main_test.go"
mode = "test"
hint = """
Pages are 1-based, so page n starts at (n-1)*pageSize — except page 1, whose
content starts at fileHeaderSize and is that much shorter:

	offset, size := int64(n-1)*int64(pageSize), pageSize
	if n == 1 {
		offset, size = fileHeaderSize, pageSize-fileHeaderSize
	}

Read it with io.ReadFull over io.NewSectionReader(ra, offset, int64(size)), and
turn io.EOF / io.ErrUnexpectedEOF into ErrNoSuchPage — that is the page being
past the end of the file."""
nudge = '''
`ReadPage` returns `ErrNoSuchPage` for every page, including pages that exist, because it never computes an offset and never reads anything.'''
stronger = '''
Pages are numbered from 1, so page n starts at `(n-1)*pageSize`. Page 1 is the exception: it starts at `fileHeaderSize` and is that many bytes shorter. Read exactly that many bytes at that offset with `io.ReadFull` over an `io.NewSectionReader`, and turn a read that runs past the end (`errors.Is` with `io.EOF` or `io.ErrUnexpectedEOF`) into `ErrNoSuchPage`.'''

[[exercises]]
name = "process1"
path = "exercises/process_control/process1/main_test.go"
mode = "test"
hint = """
	out, err := exec.Command(name, args...).Output()

Output runs the command, collects stdout only, and waits for it — no pipes, no
Wait of your own. CombinedOutput is the one that folds stderr in, which this
function promises not to do. Trim with strings.TrimRight(string(out), "\\n")."""
nudge = '''
`exec.Command` only describes a process; nothing has started it. That is why there is no output and why a missing binary is never reported as an error.'''
stronger = '''
In `RunAndCapture`, call the `*exec.Cmd` method that starts the command, collects stdout only and waits for it (`Output`, not `CombinedOutput`), and return its error. Convert the bytes to a string and strip the trailing newline with `strings.TrimRight`.'''

[[exercises]]
name = "process2"
path = "exercises/process_control/process2/main_test.go"
mode = "test"
hint = """
	cmd.Stdin = strings.NewReader(input)

That is the whole fix. os/exec copies the reader into the pipe and closes the
pipe when it is exhausted, which is the EOF the child's scanner is waiting for.
StdinPipe would work too, and only if you close it yourself. Trim the trailing
newline off the output as process1 does."""
nudge = '''
The child gets an empty stdin and reaches EOF straight away, so it has nothing to uppercase and prints nothing. `input` is never connected to the child.'''
stronger = '''
Before calling `cmd.Output()` in `Filter`, set `cmd.Stdin` to a reader over `input` (from the `strings` package). os/exec copies the reader into the child and closes the pipe when it runs out, and that close is the EOF the child is waiting for. Also trim the trailing newline from the result, since the expected values have none.'''

[[exercises]]
name = "process3"
path = "exercises/process_control/process3/main_test.go"
mode = "test"
hint = """
	var ee *exec.ExitError
	if errors.As(err, &ee) {
		return ee.ExitCode(), nil
	}
	return -1, err

*exec.ExitError means the child ran and exited non-zero — a result, not an
error. Everything else means it never started. errors.As rather than a type
assertion, because the error may be wrapped."""
nudge = '''
A child that ran and exited 3 is being reported as -1 plus an error, the same way as a command that never started. `exit status 3` here is a result to return, not an error.'''
stronger = '''
In `ExitStatus`, use `errors.As` with a `*exec.ExitError` target to check whether the child actually ran. If it did, return its `ExitCode()` with a nil error. Keep `-1, err` for everything else.'''

[[exercises]]
name = "process4"
path = "exercises/process_control/process4/main_test.go"
mode = "test"
hint = """
The whole function is one call:

	return signal.NotifyContext(parent, syscall.SIGINT, syscall.SIGTERM)

It buffers the channel, cancels the context on the first signal, follows the
parent, and its stop function unregisters the handler. Building it by hand is
worth doing once: buffered channel, signal.Notify, a goroutine that selects on
the channel and parent.Done() and cancels, and a stop that calls signal.Stop as
well as cancel."""
nudge = '''
Only SIGINT is registered, so SIGTERM still has its default action of killing the process on the spot. Even for SIGINT, nothing receives from `ch`, so the context is never cancelled, and the returned function never releases the handler.'''
stronger = '''
Rewrite `ShutdownContext` with `signal.NotifyContext`, passing both `syscall.SIGINT` and `syscall.SIGTERM`; it covers registering, cancelling and releasing in one call. To build it by hand instead: `signal.Notify` for both signals, a goroutine that cancels on the first signal or when `parent` is done, and `signal.Stop` before cancelling.'''
