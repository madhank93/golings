[[exercises]]
name = "concpat1"
path = "exercises/concurrency_patterns/concpat1/main_test.go"
mode = "test"
hint = """
A worker drains its jobs channel until it is closed:

for n := range jobs {
    results <- n * n
}
"""
nudge = '''
Every worker calls `wg.Done()` and exits without ever receiving a job, so `wg.Wait()` returns straight away and `results` is closed empty. The producer goroutine is left stuck on its first send.'''
stronger = '''
Inside `square`, receive from `jobs` until it is closed (a `for ... range` over the channel) and send each value's square on `results`. `defer wg.Done()` stays as it is.'''

[[exercises]]
name = "concpat2"
path = "exercises/concurrency_patterns/concpat2/main_test.go"
mode = "test"
hint = """
One goroutine per input copies into out; a closer waits for them all:

for _, c := range chans {
    wg.Add(1)
    go func(c <-chan int) { defer wg.Done(); for v := range c { out <- v } }(c)
}
go func() { wg.Wait(); close(out) }()
"""
nudge = '''
Go refuses to compile a local variable that is never used. `merge` declares the `WaitGroup` but never starts the goroutines that need it. Even once it compiles, `out` is never closed, so the test's `range` would block forever.'''
stronger = '''
In `merge`, loop over `chans` and start one goroutine per input, each guarded by `wg.Add`/`wg.Done`, that forwards every value into `out`. Then start one more goroutine that calls `wg.Wait()` and closes `out`. It has to be a separate goroutine because `merge` must return `out` before anything drains it.'''

[[exercises]]
name = "concpat3"
path = "exercises/concurrency_patterns/concpat3/main_test.go"
mode = "test"
hint = """
Transform each value, then close out after the input is drained:

for n := range in {
    out <- n * 2
}
close(out)
"""
nudge = '''
The `double` stage closes its output without reading anything from `in`, so the consumer's loop ends at once with no values. `generate` is left blocked on its first send.'''
stronger = '''
In the goroutine inside `double`, `range` over `in` and send each value times two on `out` before the existing `close(out)`. Closing only after the loop is what passes the shutdown down the pipeline.'''

