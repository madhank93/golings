path = "exercises/select/select3/main_test.go"
mode = "test"
hint = """
A default case runs when no other case is ready, so select never blocks:

select {
case v := <-ch: return v, true
default: return 0, false
}
"""
nudge = '''
The empty-channel test hangs: `tryReceive` does a plain blocking receive, so with nothing to read it waits forever instead of returning right away.'''
stronger = '''
In `tryReceive`, put the receive in a `select` and add a `default` case. `default` runs when no other case is ready, which makes the select non-blocking; return `(0, false)` from it.'''

[[exercises]]
name = "sync1"
path = "exercises/sync/sync1/main_test.go"
mode = "test"
race = true
hint = """
Guard the critical section:

c.mu.Lock()
defer c.mu.Unlock()
c.n++
"""
nudge = '''
`Inc` modifies `c.n` from 1000 goroutines without holding the mutex, so the race detector flags concurrent reads and writes of the same field.'''
stronger = '''
Only `Inc` is unprotected; `Value` already shows the pattern. Take `c.mu` at the top of `Inc` and release it with `defer` before touching `c.n`. A plain `go test` can pass by luck; the race detector (`-race`) is the real judge.'''

[[exercises]]
name = "sync2"
path = "exercises/sync/sync2/main_test.go"
mode = "test"
race = true
hint = """
sync.Once.Do runs its function only the first time it is called:

c.once.Do(func() { c.loads++ })
"""
nudge = '''
Every one of the 50 goroutines runs `c.loads++`, concurrently and unsynchronized, so the load happens many times and races on the field.'''
stronger = '''
In `Load`, move the increment into a function passed to the `Config`'s `once` field (`sync.Once` has a single method, `Do`). It runs the body exactly once and makes the other callers wait for it. A plain `go test` can pass by luck; the race detector (`-race`) is the real judge.'''

[[exercises]]
name = "sync3"
path = "exercises/sync/sync3/main_test.go"
mode = "test"
race = true
hint = """
Increment without a lock using an atomic operation:

atomic.AddInt64(&hits, 1)
"""
nudge = '''
`hits++` is a read-modify-write that is not atomic, so goroutines race on `hits`. Reading it with `atomic.LoadInt64` at the end does not make the writes safe.'''
stronger = '''
Replace `hits++` in the goroutine with an add from the `sync/atomic` package (already imported) that takes a pointer to `hits`. Every access to `hits` must be atomic, not just the final read. A plain `go test` can pass by luck; the race detector (`-race`) is the real judge.'''

